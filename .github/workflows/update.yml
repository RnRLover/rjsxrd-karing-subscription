name: Update subscription
on:
  workflow_dispatch:
    inputs:
      refresh_pools:
        description: 'Refresh server pools (disable to update routing/DNS on the last validated pools)'
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    paths:
      - '*.py'
      - 'settings.json'
      - 'russia-routing.json'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: update-subscription
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -v
      - name: Prepare official Xray
        run: python setup_xray.py
      - name: Prepare official sing-box rule converter
        run: python setup_singbox.py
      - name: Restore recent exit-country evidence
        uses: actions/cache/restore@v4
        with:
          path: .runtime/exit-cache.json
          key: exit-country-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: exit-country-v1-
      - name: Select diverse pool with foreign exit evidence (no public RU probes)
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_pools
        run: python generate.py --xray .runtime/xray --verify-exits
      - name: Save exit-country evidence outside subscription commits
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .runtime/exit-cache.json
          key: exit-country-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Generate single Russia profile
        run: python karing.py --xray .runtime/xray --singbox .runtime/sing-box
      - name: Check DNS startup and local DNS TCP exchange
        run: python check_fakedns.py --xray .runtime/xray
      - name: Check standalone Happ config without geofiles
        run: |
          python check_fakedns.py --xray .runtime/xray --config ru-karing-happ.txt --profile-index 0
      - name: Publish validated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if python publication_changed.py; then
            git add ru.json servers.txt report.json ru-karing.json ru-karing-incy.txt ru-karing-happ.txt karing-routing.json karing-report.json karing-geoip.dat karing-geosite.dat karing-geoip.dat.sha256 karing-geosite.dat.sha256
            git commit -m "Update validated rjsxrd subscription"
            git push
          fi
