name: Update subscription
on:
  workflow_dispatch:
    inputs:
      refresh_pools:
        description: 'Refresh server pools (disable to update routing/DNS on the last validated pools)'
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '*.py'
      - 'settings.json'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: update-subscription
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -v
      - name: Prepare official Xray
        run: python setup_xray.py
      - name: Prepare official sing-box rule converter
        run: python setup_singbox.py
      - name: Filter whitelist candidates from RU then verify foreign exits
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_pools
        run: python generate.py --xray .runtime/xray --verify-exits
      - name: Generate Karing profile with RU direct
        run: python karing.py --xray .runtime/xray --singbox .runtime/sing-box
      - name: Check FakeDNS startup and local DNS TCP exchange
        run: python check_fakedns.py --xray .runtime/xray
      - name: Check standalone Happ config without geofiles
        run: |
          python check_fakedns.py --xray .runtime/xray --config ru-karing-happ.txt --profile-index 0
          python check_fakedns.py --xray .runtime/xray --config ru-karing-happ.txt --profile-index 1
          python check_fakedns.py --xray .runtime/xray --config ru-karing-happ.txt --profile-index 2
      - name: Publish validated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ru.json servers.txt report.json premium.json premium-servers.txt premium-report.json ru-reachability.json ru-karing.json ru-karing-incy.txt ru-karing-happ.txt karing-routing.json karing-report.json karing-geoip.dat karing-geosite.dat karing-geoip.dat.sha256 karing-geosite.dat.sha256
          if ! git diff --cached --quiet; then
            git commit -m "Update validated rjsxrd subscription"
            git push
          fi
