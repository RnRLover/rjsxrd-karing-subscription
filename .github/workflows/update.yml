name: Update subscription
on:
  workflow_dispatch:
    inputs:
      refresh_pools:
        description: 'Refresh servers (disable to rebuild routing on the last validated pool)'
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    paths:
      - '*.py'
      - 'settings.json'
      - 'russia-routing.json'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: update-subscription
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove retired subscription files
        run: git rm --ignore-unmatch check_fakedns.py check_ru.py test_check_ru.py geo_dat.py happ-worker.js test_happ_worker.mjs setup_singbox.py normal.json normal-servers.txt normal-report.json normal-reachability.json ru-reachability.json ru-karing-happ-routing-test.txt ru-karing.json servers.txt karing-report.json karing-geoip.dat karing-geosite.dat karing-geoip.dat.sha256 karing-geosite.dat.sha256
      - name: Tests
        run: python -m unittest discover -v
      - name: Prepare official Xray
        run: python setup_xray.py
      - name: Restore recent exit-country evidence
        uses: actions/cache/restore@v4
        with:
          path: .runtime/exit-cache.json
          key: exit-country-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: exit-country-v1-
      - name: Select diverse pool with foreign exit evidence (no public RU probes)
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_pools
        run: python generate.py --xray .runtime/xray --verify-exits
      - name: Save exit-country evidence outside subscription commits
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .runtime/exit-cache.json
          key: exit-country-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Generate common subscription
        run: python karing.py --xray .runtime/xray
      - name: Check common JSON, legacy URLs, LAN TCP and client DNS
        run: python check_subscription.py --xray .runtime/xray
      - name: Publish validated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if python publication_changed.py || ! git diff --cached --quiet; then
            git add subscription.json ru.json report.json ru-karing-incy.txt ru-karing-happ.txt
            git commit -m "Update validated rjsxrd subscription"
            git push
          fi
