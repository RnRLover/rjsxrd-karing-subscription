name: Update subscription
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'settings.json'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: update-subscription
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned HTTP3 probe dependency
        run: python -m pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover -v
      - name: Prepare official Xray
        run: python setup_xray.py
      - name: Check HTTPS and HTTP3 probes, retries and TLS validation
        run: python check_pool_quality.py --xray .runtime/xray
      - name: Restore IPsum dataset (no server measurements)
        uses: actions/cache/restore@v4
        with:
          path: .runtime/reputation-cache.json
          key: ipsum-feed-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ipsum-feed-v2-
      - name: Build INCY pool in upstream order (known listed IPs excluded)
        id: build
        run: python -u generate.py --xray .runtime/xray
      - name: Save IPsum dataset (no server measurements)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .runtime/reputation-cache.json
          key: ipsum-feed-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check reference routing, ad blocking and protocol exceptions
        if: steps.build.outputs.ready == 'true'
        run: python check_subscription.py --xray .runtime/xray
      - name: Check Yandex and AdGuard DNS priority, DoH and UDP fallback
        if: steps.build.outputs.ready == 'true'
        run: python check_dns_transport.py --xray .runtime/xray
      - name: Check actual automatic selection and failover
        if: steps.build.outputs.ready == 'true'
        run: python check_auto_selection.py --xray .runtime/xray
      - name: Check IPv4 DNS and direct connections
        if: steps.build.outputs.ready == 'true'
        run: python check_dual_stack.py --xray .runtime/xray
      - name: Check ordinary Vision UDP443 policy, other UDP and TCP
        if: steps.build.outputs.ready == 'true'
        run: python check_quic_transport.py --xray .runtime/xray
      - name: Publish validated files
        if: steps.build.outputs.ready == 'true'
        run: python publish_subscription.py
