name: Update subscription
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    paths:
      - '*.py'
      - 'settings.json'
      - 'incy-routing.json'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: update-subscription
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -v
      - name: Prepare official Xray
        run: python setup_xray.py
      - name: Restore IPsum dataset (no server measurements)
        uses: actions/cache/restore@v4
        with:
          path: .runtime/reputation-cache.json
          key: ipsum-feed-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ipsum-feed-v2-
      - name: Build INCY pool in upstream order (known listed IPs excluded)
        run: python -u generate.py --xray .runtime/xray
      - name: Save IPsum dataset (no server measurements)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .runtime/reputation-cache.json
          key: ipsum-feed-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check common routing, DNS interception and ad blocking
        run: python check_subscription.py --xray .runtime/xray
      - name: Check split DNS transport and no direct fallback
        run: python check_dns_transport.py --xray .runtime/xray
      - name: Check actual automatic selection and failover
        run: python check_auto_selection.py --xray .runtime/xray
      - name: Check IPv4 and IPv6 direct connections and fallback
        run: python check_dual_stack.py --xray .runtime/xray
      - name: Check Vision UDP 443 permission and TCP relay
        run: python check_quic_transport.py --xray .runtime/xray
      - name: Publish validated files
        run: python publish_subscription.py
