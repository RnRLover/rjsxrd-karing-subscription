name: Update subscription
on:
  workflow_dispatch:
    inputs:
      refresh_pools:
        description: 'Refresh servers (disable to rebuild routing on the last validated pool)'
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    paths:
      - '*.py'
      - 'settings.json'
      - 'routing-policy.json'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: update-subscription
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage removal of retired delivery variants
        run: |
          git rm --ignore-unmatch geodata-download-test.json geodata-field-probe.json happ-worker.js happ.txt incy.txt isolation-a.txt isolation-b.txt routing_isolation.py ru-karing-happ.txt russia-routing.json subscription-delivery.json subscription_delivery.py test_happ_worker.mjs test_routing_isolation.py test_subscription_delivery.py
      - name: Tests
        run: python -m unittest discover -v
      - name: Prepare official Xray
        run: python setup_xray.py
      - name: Restore recent exit-country evidence
        uses: actions/cache/restore@v4
        with:
          path: .runtime/exit-cache.json
          key: exit-country-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: exit-country-v1-
      - name: Select diverse pool with foreign exit evidence (no public RU probes)
        if: github.event_name != 'workflow_dispatch' || inputs.refresh_pools
        run: python generate.py --xray .runtime/xray --verify-exits
      - name: Save exit-country evidence outside subscription commits
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .runtime/exit-cache.json
          key: exit-country-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Generate common subscription
        run: python karing.py --xray .runtime/xray
      - name: Check common routing, DNS interception and ad blocking
        run: python check_subscription.py --xray .runtime/xray
      - name: Check actual automatic selection and failover
        run: python check_auto_selection.py --xray .runtime/xray
      - name: Publish validated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if python publication_changed.py || ! git diff --cached --quiet; then
            git add subscription.json ru.json report.json
            git commit -m "Update validated rjsxrd subscription"
            git push
          fi
